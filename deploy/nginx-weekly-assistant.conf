# 周报助手：仅包含 server{} 内允许 include 的 location 指令。
location = /weekly-assistant {
    return 301 /weekly-assistant/;
}

# 回调 Token 位于查询参数中，必须关闭访问日志。
location = /weekly-assistant/api/dingtalk/robot/callback {
    access_log off;

    # No URI suffix: preserve /weekly-assistant because FastAPI root_path and
    # the mounted static application both use that external prefix.
    proxy_pass http://127.0.0.1:39022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /weekly-assistant;
}

# The platform proxy normalizes the general URI before it reaches this
# location layer. StaticFiles needs the configured FastAPI root_path, so make
# the upstream URI explicit for assets.
location ^~ /weekly-assistant/static/ {
    proxy_pass http://127.0.0.1:39022/weekly-assistant/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /weekly-assistant;
    expires 5m;
}

location ^~ /weekly-assistant/ {
    proxy_pass http://127.0.0.1:39022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /weekly-assistant;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 30s;
    client_max_body_size 2m;
}
